<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stat-AI 2.0 - Portal do Aluno de Estatística</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
      /* Melhoria visual para equações LaTeX */
      .katex { font-size: 1.1em !important; }
      .katex-display { margin: 1em 0 !important; overflow-x: auto; overflow-y: hidden; }
      
      :root {
        --bg-sidebar: #0f172a; /* slate-900 */
        --bg-main: #f1f5f9; /* slate-100 */
        --bg-card: #ffffff;
        --bg-card-hover: #f8fafc; /* slate-50 */
        --bg-code: #f1f5f9; /* slate-100 */
        --bg-user-message: #2563eb; /* blue-600 */
        --text-user-message: #ffffff;
        --text-primary: #1e293b; /* slate-800 */
        --text-secondary: #64748b; /* slate-500 */
        --text-inverted: #e2e8f0; /* slate-200 */
        --accent: #3b82f6; /* blue-500 */
        --accent-hover: #2563eb; /* blue-600 */
        --accent-light: #eff6ff; /* blue-50 */
        --accent-light-hover: #dbeafe; /* blue-100 */
        --border-color: #e2e8f0; /* slate-200 */
        --bg-secondary-action: #475569; /* slate-600 */
        --bg-secondary-action-hover: #334155; /* slate-700 */
        --text-secondary-action: #ffffff;
        font-family: 'Inter', sans-serif;
      }
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 0px rgba(56, 189, 248, 0.4);
        }
        50% {
          box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-play-button {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 10px rgba(251, 191, 36, 0);
        }
      }
      .animate-pulse-play {
        animation: pulse-play-button 2s infinite;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInFromTop {
        from { transform: translateY(-10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-in {
        animation-duration: 400ms;
        animation-fill-mode: both;
      }
      .fade-in {
        animation-name: fadeIn;
      }
      .slide-in-from-top-4 {
        animation-name: slideInFromTop;
      }
    </style>

</head>
  <body class="bg-[--bg-main] text-[--text-primary]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
