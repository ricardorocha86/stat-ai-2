<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title"><title id="title">Classificação dos tipos de variáveis</title><rect width="900" height="360" fill="white"/><g font-family="Arial,sans-serif" fill="#334155"><rect x="350" y="20" width="200" height="50" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="450.0" y="51.0" text-anchor="middle" font-size="17" fill="#334155">Variáveis</text><line x1="450" y1="70" x2="225" y2="125" stroke="#64748b" stroke-width="2"/><line x1="450" y1="70" x2="675" y2="125" stroke="#64748b" stroke-width="2"/><rect x="90" y="125" width="270" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="225.0" y="158.5" text-anchor="middle" font-size="17" fill="#334155">Qualitativas / categóricas</text><rect x="540" y="125" width="270" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="675.0" y="158.5" text-anchor="middle" font-size="17" fill="#334155">Quantitativas / numéricas</text><line x1="225" y1="180" x2="112" y2="235" stroke="#64748b" stroke-width="2"/><rect x="10" y="235" width="205" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="112.5" y="268.5" text-anchor="middle" font-size="17" fill="#334155">Nominais</text><text x="112" y="325" text-anchor="middle" font-size="12" fill="#334155">sexo, raça, região, grupo sanguíneo</text><line x1="225" y1="180" x2="337" y2="235" stroke="#64748b" stroke-width="2"/><rect x="235" y="235" width="205" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="337.5" y="268.5" text-anchor="middle" font-size="17" fill="#334155">Ordinais</text><text x="337" y="325" text-anchor="middle" font-size="12" fill="#334155">classe social, escolaridade</text><line x1="675" y1="180" x2="562" y2="235" stroke="#64748b" stroke-width="2"/><rect x="460" y="235" width="205" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="562.5" y="268.5" text-anchor="middle" font-size="17" fill="#334155">Discretas</text><text x="562" y="325" text-anchor="middle" font-size="12" fill="#334155">número de filhos, acidentes</text><line x1="675" y1="180" x2="787" y2="235" stroke="#64748b" stroke-width="2"/><rect x="685" y="235" width="205" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="787.5" y="268.5" text-anchor="middle" font-size="17" fill="#334155">Contínuas</text><text x="787" y="325" text-anchor="middle" font-size="12" fill="#334155">peso, altura, idade, renda</text></g></svg>