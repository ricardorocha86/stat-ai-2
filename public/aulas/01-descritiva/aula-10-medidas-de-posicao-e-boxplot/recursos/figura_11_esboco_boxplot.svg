<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title"><title id="title">Elementos de um boxplot</title><rect width="900" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#334155"><line x1="240" y1="45" x2="240" y2="350" stroke="#64748b" stroke-width="2"/><line x1="225" y1="45" x2="255" y2="45" stroke="#64748b" stroke-width="2"/><line x1="225" y1="350" x2="255" y2="350" stroke="#64748b" stroke-width="2"/><rect x="180" y="115" width="120" height="155" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><line x1="180" y1="200" x2="300" y2="200" stroke="#2563eb" stroke-width="3"/><text x="390" y="120" text-anchor="start" font-size="20" fill="#334155">Q₃</text><text x="390" y="205" text-anchor="start" font-size="20" fill="#334155">Q₂ = mediana</text><text x="390" y="275" text-anchor="start" font-size="20" fill="#334155">Q₁</text><text x="390" y="50" text-anchor="start" font-size="16" fill="#334155">Maior valor dentro dos limites</text><text x="390" y="355" text-anchor="start" font-size="16" fill="#334155">Menor valor dentro dos limites</text><circle cx="240" cy="20" r="5" fill="#d97706"/><text x="390" y="25" text-anchor="start" font-size="16" fill="#334155">Valor atípico (outlier)</text></g></svg>