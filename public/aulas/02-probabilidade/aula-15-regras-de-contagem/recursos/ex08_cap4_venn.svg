<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title"><title id="title">Eventos A e B e sua interseção</title><rect width="900" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#334155"><rect x="30" y="30" width="840" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><ellipse cx="360" cy="180" rx="210" ry="125" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-width="3"/><ellipse cx="550" cy="180" rx="210" ry="125" fill="#0d9488" fill-opacity=".18" stroke="#0d9488" stroke-width="3"/><text x="260" y="160" text-anchor="middle" font-size="26" fill="#334155">A</text><text x="650" y="160" text-anchor="middle" font-size="26" fill="#334155">B</text><text x="450" y="190" text-anchor="middle" font-size="23" fill="#334155">A ∩ B</text><text x="450" y="235" text-anchor="middle" font-size="16" fill="#334155">P(A ∩ B) = 0,25</text><text x="230" y="365" text-anchor="middle" font-size="20" fill="#334155">P(A) = 0,60</text><text x="660" y="365" text-anchor="middle" font-size="20" fill="#334155">P(B) = 0,45</text></g></svg>